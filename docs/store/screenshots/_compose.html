<!DOCTYPE html>
<!-- Helper for the store screenshot script: places the popup over a page screenshot, top right, as Chrome shows it. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #fff; }
  .page { position: absolute; inset: 0; width: 1280px; height: 800px; }
  .popup { position: absolute; top: 12px; right: 28px; border-radius: 12px; box-shadow: 0 18px 48px rgba(0, 0, 0, .28), 0 0 0 1px rgba(0, 0, 0, .12); }
</style>
</head>
<body>
  <img class="page" src="_popup-backdrop.png" alt="">
  <img class="popup" src="_popup.png" alt="">
</body>
</html>
